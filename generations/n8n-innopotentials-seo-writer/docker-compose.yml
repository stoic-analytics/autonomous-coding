version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-seo-writer
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=http://localhost:5678/
      # Timezone: Vienna
      - GENERIC_TIMEZONE=Europe/Vienna
      - TZ=Europe/Vienna
      # GDPR compliance settings
      - EXECUTIONS_DATA_SAVE_ON_ERROR=none
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Project environment variables
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - COMFYUI_HOST=${COMFYUI_HOST}
      - WORDPRESS_URL=${WORDPRESS_URL}
      # SMTP env vars for email notifications
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TO=${SMTP_TO}
      # Allow access to env vars in expressions
      - N8N_ACCESSIBLE_ENV_VARS=GOOGLE_SHEET_ID,OLLAMA_HOST,OLLAMA_MODEL,COMFYUI_HOST,WORDPRESS_URL,SMTP_FROM,SMTP_TO
      # Sequential processing: limit concurrent production executions
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=5
      # Execution pruning: keep last 7 days, max 500 executions
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=500
      # API key for programmatic access
      - N8N_API_KEY=${N8N_API_KEY:-n8n-api-key-for-automation}
    volumes:
      - ./n8n-data:/home/node/.n8n
    networks:
      - seo-writer-network

networks:
  seo-writer-network:
    driver: bridge
